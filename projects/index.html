  <meta name="description" content="Vexion's latest projects: the FIRTACH virtual assistant and the VEX web browser.">

<body>
  <script src="/assets/js/layout.js"></script>

  <main>
    <header class="page-head">
      <div class="container">
        <span class="eyebrow">// projects</span>
        <h1 class="page-title">Latest Projects</h1>
        <p class="section-lede">See what I've been working on lately and keep updated on current projects.</p>
      </div>
    </header>

    <section class="container section project-list">
      <div class="project-grid" data-stagger>
        <div data-reveal>
          <a class="card project-card" href="/projects/firtach.html" data-tilt>
            <div class="project-card__media">
              <img src="/assets/images/projects/firtach/banner.png" alt="FIRTACH's interface saying: Welcome back. What can I do for you?" width="1080" height="810">
            </div>
            <div class="project-card__body">
              <h2 class="project-card__name">FIRTACH</h2>
              <p class="project-card__text">Voice assistant in the style of JARVIS from Iron Man, now built into my VEX Workspace dashboard.</p>
              <span class="link-arrow">Learn more <span class="link-arrow__icon" aria-hidden="true">→</span></span>
            </div>
          </a>
        </div>
        <div data-reveal>
          <a class="card project-card" href="/projects/vex-browser.html" data-tilt>
            <div class="project-card__media">
              <img src="/assets/images/projects/vex-browser/banner.png" alt="VEX Browser logo above a screenshot of the browser window" width="1080" height="810">
            </div>
            <div class="project-card__body">
              <h2 class="project-card__name">VEX Browser</h2>
              <p class="project-card__text">Basic and secure web browser.</p>
              <span class="link-arrow">Learn more <span class="link-arrow__icon" aria-hidden="true">→</span></span>
            </div>
          </a>
        </div>
      </div>
    </section>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <title>Post · Vexion</title>
  <meta name="description" content="A post from Vexion.">
  <meta name="theme-color" content="#0e0c13">
  <link rel="icon" href="/assets/images/brand/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Instrument+Sans:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/pages.css">
  <script type="module" src="/assets/js/motion.js"></script>
  <script type="module" src="/assets/js/pages/post.js"></script>
</head>
<body>
  <script src="/assets/js/layout.js"></script>
  <div class="read-progress" data-read-progress aria-hidden="true"></div>

  <main>
    <article class="article" data-article data-read-progress-target hidden>
      <a class="article__back" href="/posts/">← All posts</a>
      <h1 class="article__title" data-title></h1>
      <div class="article__meta">
        <time data-date></time>
        <span data-reading-time></span>
        <a data-edit hidden>Edit this post</a>
      </div>
      <figure class="article__cover" data-cover hidden>
        <img alt="">
      </figure>
      <div class="prose article__body" data-body></div>
    </article>

    <div class="not-found" data-missing hidden>
      <div>
        <h1 class="section-title"></h1>
        <p></p>
        <a class="btn btn--ghost" href="/posts/">Back to all posts</a>
      </div>
    </div>
  </main>
</body>
</html>
